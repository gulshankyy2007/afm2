# ==============================================================================
# AFM#2 — Gitleaks Security Policy Configuration (.gitleaks.toml)
# https://github.com/gitleaks/gitleaks
# ==============================================================================

title = "AFM#2 Preventive Secret Detection Policy"

[extend]
useDefault = true

[allowlist]
description = "Allowlist documentation placeholders, configuration templates, and isolated test fixtures"
paths = [
    '''^\.env\.example$''',
    '''^README\.md$''',
    '''^docs/.*''',
    '''^tests/.*'''
]
regexes = [
    '''generate_a_random_32_character_hex_secret_before_production''',
    '''your_db_username''',
    '''your_db_password'''
]
