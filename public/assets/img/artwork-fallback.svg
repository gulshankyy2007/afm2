<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="vinylGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2a231d" />
      <stop offset="60%" stop-color="#161311" />
      <stop offset="100%" stop-color="#0b0a09" />
    </radialGradient>
    <radialGradient id="centerLabel" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e8b975" />
      <stop offset="70%" stop-color="#c48b3b" />
      <stop offset="100%" stop-color="#7a4e15" />
    </radialGradient>
    <linearGradient id="sheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.12)" />
      <stop offset="50%" stop-color="transparent" />
      <stop offset="100%" stop-color="rgba(255,255,255,0.06)" />
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="400" height="400" rx="32" fill="url(#vinylGlow)" />

  <!-- Outer Vinyl Grooves -->
  <circle cx="200" cy="200" r="170" fill="none" stroke="#221e1a" stroke-width="1.5" opacity="0.8" />
  <circle cx="200" cy="200" r="155" fill="none" stroke="#28231f" stroke-width="1" opacity="0.7" />
  <circle cx="200" cy="200" r="140" fill="none" stroke="#221e1a" stroke-width="1.5" opacity="0.8" />
  <circle cx="200" cy="200" r="125" fill="none" stroke="#28231f" stroke-width="1" opacity="0.7" />
  <circle cx="200" cy="200" r="110" fill="none" stroke="#221e1a" stroke-width="1.5" opacity="0.8" />
  <circle cx="200" cy="200" r="95" fill="none" stroke="#28231f" stroke-width="1" opacity="0.7" />

  <!-- Sheen Highlight Wedge -->
  <path d="M 200,200 L 100,50 A 180 180 0 0 1 300,50 Z" fill="url(#sheen)" />
  <path d="M 200,200 L 300,350 A 180 180 0 0 1 100,350 Z" fill="url(#sheen)" />

  <!-- Center Label -->
  <circle cx="200" cy="200" r="65" fill="url(#centerLabel)" stroke="#4a3111" stroke-width="2" />
  <circle cx="200" cy="200" r="58" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="0.8" />
  
  <!-- Center Spindle Hole -->
  <circle cx="200" cy="200" r="14" fill="#0b0a09" stroke="#5a3d16" stroke-width="2" />

  <!-- AFM#2 Stamp in Center Label -->
  <text x="200" y="180" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#2d1b06" text-anchor="middle" letter-spacing="2">AFM#2</text>
  <text x="200" y="228" font-family="'Playfair Display', serif" font-size="9" font-style="italic" fill="#3d260a" text-anchor="middle">Acoustic Edition</text>
</svg>
